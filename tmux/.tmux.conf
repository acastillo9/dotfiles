set -g mouse on
set -g base-index 1
set -g renumber-windows 1
set -g set-clipboard on
setw -g mode-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u

# term color support
set-option -a terminal-features 'xterm-256color:RGB'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator " |"
set -g @catppuccin_window_text "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]#W"
set -g @catppuccin_window_number "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]#I"
set -g @catppuccin_window_current_text "#[fg=#{@thm_crust},bg=#{@thm_mauve}]#W"
set -g @catppuccin_window_current_number "#[fg=#{@thm_crust},bg=#{@thm_mauve}]#I"
set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_text_color "#{@thm_mauve}"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

# Balanced padding so icons/text sit centered in their blocks
set -g @catppuccin_session_icon       " "
set -g @catppuccin_session_text       " #S "
set -g @catppuccin_application_icon   " "
set -g @catppuccin_application_text   " #{pane_current_command} "
set -g @catppuccin_directory_icon     " "
set -g @catppuccin_directory_text     " #{b:pane_current_path} "
set -g @catppuccin_battery_icon       "#{l:#{battery_icon}} "
set -g @catppuccin_battery_text       " #{l:#{battery_percentage}} "
set -g @catppuccin_cpu_icon           " "
set -g @catppuccin_cpu_text           " #{l:#{cpu_percentage}} "
set -g @catppuccin_ram_icon           " "
set -g @catppuccin_ram_text           " #{l:#{ram_percentage}} "
set -g @catppuccin_date_time_icon     "󰃰 "
set -g @catppuccin_date_time_text     " %Y-%m-%d %H:%M "

run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-left "#{E:@catppuccin_status_session}#[bg=#{@thm_bg}] "

set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g status-left-length 100
set -g status-right-length 100

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
