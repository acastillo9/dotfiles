# ly config - Catppuccin Mocha theme (16-color mode)
#
# The Linux console (VT) cannot render 24-bit truecolor, so `full_color` is
# disabled and colors use the 8-color index codes below, resolved through the
# 16-color console palette set by startup.sh.
#
# Color format is 0xSSRRGGBB. In 8-color mode the low byte is the palette
# index (TB_DEFAULT 0x00, TB_BLACK 0x01, TB_RED 0x02, TB_GREEN 0x03,
# TB_YELLOW 0x04, TB_BLUE 0x05, TB_MAGENTA 0x06, TB_CYAN 0x07, TB_WHITE 0x08)
# and the SS byte is a styling bitmask:
#   TB_BOLD 0x01000000  TB_UNDERLINE 0x02000000  TB_REVERSE 0x04000000
#   TB_ITALIC 0x08000000  TB_BLINK 0x10000000  TB_HI_BLACK 0x20000000
#   TB_BRIGHT 0x40000000  TB_DIM 0x80000000
#
# Palette set by startup.sh (index -> Catppuccin Mocha):
#   0 base #1e1e2e   1 red #f38ba8   2 green #a6e3a1   3 yellow #f9e2af
#   4 blue #89b4fa  5 mauve #cba6f7  6 teal #94e2d5   7 subtext1 #bac2de
#   8 surface2 #585b70   9 red   10 green  11 yellow  12 blue
#   13 pink #f5c2e7  14 teal  15 text #cdd6f4
#
# Any option omitted here falls back to ly's compiled-in default.

# ---- Appearance ---------------------------------------------------------

# Main box background (black -> palette 0 = base)
bg = 0x01

# Foreground / text (bright white -> palette 15 = text)
fg = 0x40000008

# Box border (magenta -> palette 5 = mauve)
border_fg = 0x06

# Error colors (bold red -> palette 9)
error_bg = 0x01
error_fg = 0x01000002

# Show the main box background (false = transparent box)
blank_box = true

# Remove box borders
hide_borders = false

# Active animation: none | doom | matrix | colormix | gameoflife | dur_file
animation = matrix

# Delay between animation frames (ms)
animation_frame_delay = 5

# CMatrix colors (green + bold teal head)
cmatrix_fg = 0x03
cmatrix_head_col = 0x01000007

# colormix colors (mauve -> blue -> pink)
colormix_col1 = 0x06
colormix_col2 = 0x05
colormix_col3 = 0x40000006

# DOOM fire colors (red -> yellow -> bright white)
doom_top_color = 0x02
doom_middle_color = 0x04
doom_bottom_color = 0x40000008

# Game of Life color (green)
gameoflife_fg = 0x03

# Big ASCII clock: none | en | fa
bigclock = en
bigclock_12hr = false
bigclock_seconds = false

# strftime clock in top-right (null = off)
clock = null

# Title at top of box (null = none)
box_title = null

# Hide version string / keyboard lock indicators
hide_version_string = true
hide_keyboard_locks = true
hide_key_hints = true

# Password mask character
asterisk = *

# 8-color mode (the Linux VT cannot render 24-bit truecolor)
full_color = false
