# hyprlock — Catppuccin Mocha
background {
    monitor =
    path = ~/Images/wallpaper-1.jpg
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(cba6f7cc)
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i><span foreground="##cdd6f4">Password...</span></i>
    hide_input = false
    rounding = -1
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(f9e2af)
    numlock_color = rgb(f9e2af)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(whoami)"
    color = rgb(cdd6f4)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgb(cdd6f4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
